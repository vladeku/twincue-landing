<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Support · Twincue</title>
<meta name="description" content="How to get help with Twincue.">
<meta name="theme-color" content="#256F8A">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="canonical" href="https://twincue.app/support/">
<style>
  :root { --bg: #FFFFFF; --ink: #1D1D1F; --muted: #6E6E73; --line: #E5E5EA; --accent: #256F8A; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000000; --ink: #F5F5F7; --muted: #98989D; --line: #2C2C2E; --accent: #4FB3CC; } }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Inter, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.55; }
  a { color: var(--accent); }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
  .shell { width: 100%; max-width: 760px; margin: 0 auto; padding-inline: 24px; }
  .top { display: flex; align-items: center; justify-content: space-between; padding-block: 18px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
  .brand img { width: 34px; height: 34px; }
  .top nav a { font-size: 15px; font-weight: 600; text-decoration: none; }
  article { padding-block: 40px 64px; }
  h1 { font-size: clamp(32px, 5vw, 44px); font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
  .date { color: var(--muted); font-size: 15px; margin-top: 10px; }
  h2 { font-size: 21px; font-weight: 800; letter-spacing: -.02em; margin: 36px 0 10px; }
  p { font-size: 17px; margin-top: 12px; }
  ul { margin: 10px 0 0 22px; font-size: 17px; }
  li { margin-top: 6px; }
</style>
</head>
<body>
<header class="shell top">
  <a class="brand" href="../"><img src="../assets/icon-256.png" alt="" width="34" height="34">Twincue</a>
</header>
<main class="shell">
<article>
<h1>Support</h1>
<p>Questions or problems with Twincue? Write to <a href="mailto:support@twincue.app">support@twincue.app</a>.</p>
</article>
</main>
</body>
</html>
