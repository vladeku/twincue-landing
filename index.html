<style>
  :root {
    --bg: #FFFFFF; --ink: #1D1D1F; --muted: #6E6E73; --line: #E5E5EA;
    --accent: #256F8A; --accent-ink: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --ink: #F5F5F7; --muted: #98989D; --line: #2C2C2E; --accent: #4FB3CC; }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Inter, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.5;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  a { color: var(--accent); }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
  main { flex: 1; display: grid; place-items: center; padding: 48px 24px; text-align: center; }
  .icon { width: 128px; height: 128px; }
  h1 { font-size: clamp(34px, 6vw, 56px); font-weight: 800; letter-spacing: -.035em; line-height: 1.05; margin-top: 28px; text-wrap: balance; }
  .lede { font-size: 19px; color: var(--muted); max-width: 44ch; margin: 18px auto 0; text-wrap: balance; }
  .store { display: inline-block; line-height: 0; margin-top: 30px; border-radius: 8px; }
  .store img { height: 54px; width: auto; }
  footer { padding: 0 24px 28px; text-align: center; font-size: 14px; color: var(--muted); }
  footer a { color: var(--muted); margin-inline: 8px; }
</style>

<body>
<main>
  <div>
    <img class="icon" src="assets/icon-512.png" alt="Twincue app icon: a video camera with three lines of text on its body" width="128" height="128">
    <h1>Read your script next to the&nbsp;camera.</h1>
    <p class="lede">Twincue rolls your script under the lens while you record on your iPhone, so you read the words and keep your eyes on your audience.</p>
    <a class="store" href="https://apps.apple.com/app/id6818950486" aria-label="Download on the App Store"><img src="assets/appstore-badge.svg" alt="Download on the App Store" width="162" height="54"></a>
  </div>
</main>
<footer>
